{% extends "base.html" %}
{% block title %}Catégories{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold">Catégories</h1>
    <a href="{% url 'produits:creer_categorie' %}"
       class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        + Nouvelle catégorie
    </a>
</div>

<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-neutral-50 text-neutral-500 text-left">
            <tr>
                <th class="px-4 py-3">Nom</th>
                <th class="px-4 py-3">Description</th>
                <th class="px-4 py-3"></th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr class="border-t border-neutral-100 hover:bg-neutral-50">
                <td class="px-4 py-3 font-medium">{{ cat.nom }}</td>
                <td class="px-4 py-3 text-neutral-500">{{ cat.description|default:"—" }}</td>
                <td class="px-4 py-3 text-right space-x-2 whitespace-nowrap">
                    <a href="{% url 'produits:modifier_categorie' cat.pk %}" class="text-blue-600 hover:underline">Modifier</a>
                    <a href="{% url 'produits:supprimer_categorie' cat.pk %}" class="text-red-600 hover:underline">Supprimer</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="px-4 py-6 text-center text-neutral-400">Aucune catégorie.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
