{% extends "base.html" %}
{% block title %}Supprimer un produit{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm p-6 max-w-lg">
    <h1 class="text-xl font-semibold mb-3">Confirmer la suppression</h1>
    <p class="text-neutral-600 mb-6">
        Es-tu sûre de vouloir supprimer le produit
        <strong>{{ produit.designation }}</strong> ({{ produit.reference }}) ?
        Cette action est irréversible.
    </p>
    <form method="post" class="flex gap-3">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
            Oui, supprimer
        </button>
        <a href="{% url 'produits:liste_produits' %}" class="text-neutral-500 px-4 py-2 text-sm">Annuler</a>
    </form>
</div>
{% endblock %}
